[package]
name = "unha"
version = "0.1.1"
edition = "2021"
description = "Audio downloader UI (yt-dlp + ffmpeg)"
authors = ["unha"]

[lib]
name = "unha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "sync"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
yt-dlp = { version = "2", default-features = false, features = ["rustls"] }
regex = "1"
once_cell = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
futures-util = "0.3"
